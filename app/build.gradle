plugins {
    id 'com.android.application'
}

// Jede Version bekommt die Nummer des GitHub-Laufs, damit Updates sauber drüber installieren.
def lauf = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'de.lukas.kino'
    compileSdk 35

    defaultConfig {
        applicationId 'de.lukas.kino'
        minSdk 26
        targetSdk 34
        versionCode lauf
        versionName "1.0.${lauf}"
    }

    // Fester Schlüssel nur, damit neue Versionen über die alte installiert werden können.
    // Nicht sicherheitsrelevant: installieren kann man nur per ADB im eigenen Heimnetz.
    signingConfigs {
        release {
            storeFile rootProject.file('signing/lukaskino.jks')
            storePassword 'lukaskino'
            keyAlias 'lukaskino'
            keyPassword 'lukaskino'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // Player für den Filmbereich (Direct Play, Ton- und Untertitelspuren)
    implementation 'androidx.media3:media3-exoplayer:1.5.0'
    implementation 'androidx.media3:media3-ui:1.5.0'
    // Software-Decoder (DTS, TrueHD …), falls der Fernseher eine Tonspur nicht selbst kann – wie in der Jellyfin-App
    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.5.0+1'
}
